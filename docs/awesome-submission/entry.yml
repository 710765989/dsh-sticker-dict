name: 710765989/dsh-sticker-dict
category: vision
description:
  en: Splits a GIF into evenly sampled frames laid out as one contact sheet, and keeps a local sticker dictionary keyed by content hash so an image already described is recalled instead of re-read.
  zh: 把 GIF 均匀抽帧拼成一张联系表，并维护一本按内容哈希索引的本地表情包字典，看过的图直接复用描述而不再重复识图。
